packages:
  - "."

overrides:
  axios: 0.35.0
  vite: "catalog:"
  vitest: "catalog:"

allowBuilds:
  es5-ext: true

minimumReleaseAgeExclude:
  - "@putdotio/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0
  "@vitest/coverage-v8": 5.1.1
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
