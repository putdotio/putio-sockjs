packages:
  - "."

overrides:
  axios: 0.32.0
  vite: "catalog:"
  vitest: "catalog:"

allowBuilds:
  es5-ext: true

minimumReleaseAgeExclude:
  - "@putdotio/*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vitest: 5.1.0
  vite-plus: 1.6.0
  "@vitest/coverage-v8": 5.1.0
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
